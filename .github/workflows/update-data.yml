name: Update data

on:
  schedule:
    - cron: "30 5 * * *" # daily, 05:30 UTC = morning Swiss time
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Zurich # "yesterday" in fetch_hydrodaten.py follows station time
    steps:
      - uses: actions/checkout@v4

      - name: Fetch newest daily means from hydrodaten.admin.ch
        run: python3 fetch_hydrodaten.py

      - name: Rebuild site
        run: python3 build_site.py

      - name: Commit and push if the data changed
        run: |
          git add rhein_rekingen_daily.csv index.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Tagesmittel aktualisiert"
            git push
          fi
