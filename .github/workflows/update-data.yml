name: Update data

on:
  schedule:
    - cron: "30 5 * * *" # daily, 05:30 UTC = morning Swiss time
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Zurich # "yesterday" in fetch_hydrodaten.py follows station time
    steps:
      - uses: actions/checkout@v4

      - name: Fetch newest daily means from hydrodaten.admin.ch
        run: python3 fetch_hydrodaten.py

      - name: Rebuild and publish if the data changed
        run: |
          if git diff --quiet rhein_rekingen_daily.csv; then
            echo "Keine neuen Messwerte."
            exit 0
          fi
          python3 build_site.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rhein_rekingen_daily.csv index.html
          git commit -m "Tagesmittel aktualisiert"
          git push
